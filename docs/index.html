<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Roblox Monitor</title>

    <style>
      body {
        background: #111;
        color: white;
        font-family: sans-serif;
        padding: 40px;
      }

      .title {
        font-size: 40px;
        margin-bottom: 30px;
      }

      .status {
        font-size: 60px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .game {
        font-size: 30px;
        margin-bottom: 10px;
      }

      .updated {
        color: #aaa;
        margin-bottom: 40px;
      }

      .log {
        background: #1d1d1d;
        padding: 12px;
        border-radius: 10px;
        margin-bottom: 10px;
        font-family: monospace;
      }
    </style>
  </head>

  <body>
    <div class="title">Roblox Presence Monitor</div>

    <div id="username"></div>

    <div class="status" id="status">Loading...</div>

    <div class="game" id="game"></div>

    <div class="updated" id="updated"></div>

    <h2>Logs</h2>

    <div id="logs"></div>

    <script>
      async function loadStatus() {
        try {
          const res = await fetch(
            "https://roblox-monitor-owse.onrender.com/status",
          );

          const data = await res.json();

          console.log(data);

          document.getElementById("username").innerText =
            "USERNAME: " + data.username;

          document.getElementById("status").innerText = data.status;

          document.getElementById("game").innerText = data.game || "";

          document.getElementById("updated").innerText =
            "Updated: " + data.updated;

          const logsDiv = document.getElementById("logs");

          logsDiv.innerHTML = "";

          data.logs
            .slice()
            .reverse()
            .forEach((log) => {
              const el = document.createElement("div");

              el.className = "log";

              el.innerText =
                "[" + log.updated + "] " + log.status + " " + (log.game || "");

              logsDiv.appendChild(el);
            });
        } catch (err) {
          console.error(err);

          document.getElementById("status").innerText = "API ERROR";
        }
      }

      loadStatus();

      setInterval(loadStatus, 5000);
    </script>
  </body>
</html>
