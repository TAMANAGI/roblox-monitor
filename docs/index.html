<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="color-scheme" content="dark" />
    <title>Roblox Presence Monitor</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        background: #0f0f0f;
        color: white;
        font-family:
          ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji",
          "Segoe UI Emoji";
        padding: calc(28px + env(safe-area-inset-top))
          calc(20px + env(safe-area-inset-right))
          calc(28px + env(safe-area-inset-bottom))
          calc(20px + env(safe-area-inset-left));
        max-width: 900px;
        margin: 0 auto;
        overflow-x: hidden;
      }

      .app-main {
        width: 100%;
        min-width: 0;
      }

      .title {
        font-size: clamp(1.5rem, 5.5vw, 3rem);
        margin-bottom: 1.25rem;
        font-weight: bold;
        line-height: 1.15;
      }

      .credentials-drawer {
        margin-bottom: 40px;
        border-radius: 16px;
        border: 1px solid #333;
        background: #141414;
        overflow: hidden;
      }

      .credentials-drawer-summary {
        list-style: none;
        padding: 16px 18px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 6px;
        justify-content: center;
        min-height: 52px;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        font-family: inherit;
        color: inherit;
      }

      .credentials-drawer-summary::-webkit-details-marker {
        display: none;
      }

      .credentials-drawer-summary::marker {
        content: "";
      }

      .credentials-drawer-title {
        font-weight: 700;
        font-size: 1.05rem;
      }

      .credentials-drawer-sub {
        font-size: 13px;
        color: #888;
        line-height: 1.35;
      }

      .credentials-drawer[open] > .credentials-drawer-summary {
        border-bottom: 1px solid #2a2a2a;
      }

      .credentials-drawer-body {
        padding: 14px 14px 18px;
      }

      .credentials-drawer-body .settings {
        margin-bottom: 22px;
      }

      .credentials-drawer-body .search {
        margin-bottom: 0;
      }

      .search-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .search-row input {
        flex: 1 1 260px;
        min-width: min(100%, 200px);
        width: auto;
      }

      .search-row button {
        margin-left: 0;
      }

      code {
        font-size: max(11px, 0.92em);
        word-break: break-all;
      }

      .monitor-hint {
        margin-top: 12px;
        font-size: 14px;
        color: #a3a3a3;
        line-height: 1.5;
        min-height: 1.5em;
        overflow-wrap: anywhere;
      }

      .notify-row {
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .notify-status {
        font-size: 13px;
        color: #888;
        flex: 1 1 200px;
        line-height: 1.4;
      }

      .settings {
        background: #1a1a1a;
        padding: 24px;
        border-radius: 16px;
      }

      .settings-title {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .settings-hint {
        color: #888;
        font-size: 14px;
        margin-bottom: 16px;
        line-height: 1.5;
      }

      .settings-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .settings-row button {
        margin-left: 0;
      }

      .token-input {
        flex: 1 1 auto;
        min-width: 0;
      }

      .token-status {
        margin-top: 12px;
        font-size: 14px;
        color: #888;
      }

      .token-status.ok {
        color: #4ade80;
      }

      .token-status.warn {
        color: #fbbf24;
      }

      input {
        padding: 15px 16px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        min-height: 48px;
        border: 1px solid #333;
        border-radius: 14px;
        font-size: 16px;
        line-height: 1.3;
        background: #1f1f1f;
        color: white;
        -webkit-appearance: none;
        appearance: none;
      }

      input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35);
      }

      button {
        padding: 15px 20px;
        border: none;
        border-radius: 14px;
        font-size: 17px;
        font-weight: 600;
        line-height: 1.25;
        min-height: 48px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        margin: 0;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        width: auto;
      }

      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.45);
      }

      button.secondary {
        background: #333;
      }

      button.secondary:focus-visible {
        box-shadow: 0 0 0 3px rgba(163, 163, 163, 0.35);
      }

      .profile {
        display: flex;
        gap: clamp(16px, 4vw, 30px);
        align-items: center;
        margin-bottom: 32px;
        min-width: 0;
      }

      .profile > div:last-child {
        flex: 1;
        min-width: 0;
      }

      .avatar {
        width: 112px;
        height: 112px;
        border-radius: 18px;
        object-fit: cover;
        flex-shrink: 0;
        background: #1f1f1f;
      }

      .display-name {
        font-size: clamp(1.35rem, 5vw, 2.45rem);
        font-weight: bold;
        line-height: 1.15;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .username {
        color: #888;
        font-size: clamp(0.95rem, 3.5vw, 1.25rem);
        margin-top: 5px;
        overflow-wrap: anywhere;
      }

      .status {
        font-size: clamp(2rem, 11vw, 3.65rem);
        font-weight: bold;
        margin-top: 16px;
        line-height: 1.05;
        overflow-wrap: anywhere;
      }

      .game {
        font-size: clamp(0.94rem, 3.8vw, 1.72rem);
        margin-top: 10px;
        color: #ccc;
        line-height: 1.45;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .stats {
        display: flex;
        gap: 14px;
        margin-top: 16px;
        flex-wrap: wrap;
      }

      .card {
        background: #1a1a1a;
        padding: 18px;
        border-radius: 14px;
        flex: 1 1 140px;
        min-width: 0;
      }

      .card-title {
        color: #888;
        margin-bottom: 10px;
        font-size: 13px;
        letter-spacing: 0.04em;
      }

      .card-value {
        font-size: clamp(1.25rem, 5vw, 1.75rem);
        font-weight: bold;
        overflow-wrap: anywhere;
      }

      .logs-title {
        margin-top: 40px;
        margin-bottom: 16px;
        font-size: clamp(1.25rem, 4vw, 2rem);
      }

      .log {
        background: #1a1a1a;
        padding: 12px;
        border-radius: 12px;
        margin-bottom: 10px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 13px;
        overflow-wrap: anywhere;
        line-height: 1.4;
      }

      .hidden {
        display: none !important;
      }

      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #0d0d0d;
        padding: calc(40px + env(safe-area-inset-top))
          calc(24px + env(safe-area-inset-right))
          calc(32px + env(safe-area-inset-bottom))
          calc(24px + env(safe-area-inset-left));
        overflow: auto;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        transition: opacity 0.45s ease;
        -webkit-overflow-scrolling: touch;
      }

      .boot-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .boot-brand {
        font-family: sans-serif;
        font-size: 15px;
        font-weight: 600;
        color: #f5f5f5;
        margin-bottom: 36px;
        letter-spacing: 0.02em;
      }

      .boot-log {
        font-size: 13px;
        line-height: 1.75;
        color: #d4d4d4;
      }

      .boot-line {
        white-space: pre-wrap;
      }

      .boot-ascii {
        margin: 12px 0 20px;
        color: #f0f0f0;
        white-space: pre;
        font-size: clamp(7px, 1.8vw, 11px);
        line-height: 1.15;
        max-width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      @media (min-width: 720px) {
        .avatar {
          width: 140px;
          height: 140px;
          border-radius: 20px;
        }

        .stats {
          gap: 20px;
        }

        .card {
          padding: 20px;
          border-radius: 16px;
        }
      }

      @media (max-width: 768px) {
        .credentials-drawer {
          margin-bottom: 28px;
        }

        .credentials-drawer-summary {
          padding: 15px 14px;
          min-height: 52px;
        }

        .credentials-drawer-body {
          padding: 12px 10px 16px;
        }

        .credentials-drawer-body .settings {
          margin-bottom: 18px;
        }

        .settings {
          padding: 17px 14px;
          border-radius: 14px;
        }

        .settings-title {
          font-size: 1.125rem;
        }

        .settings-hint {
          font-size: 13px;
        }

        .search-row,
        .settings-row {
          flex-direction: column;
          align-items: stretch;
          gap: 12px;
        }

        .settings-row .token-input {
          flex: none;
          width: 100%;
          min-height: 52px;
        }

        .search-row input {
          flex: none;
          width: 100%;
          min-width: 0;
          min-height: 52px;
        }

        .settings-row button,
        .search-row button {
          flex: none;
          width: 100%;
          min-height: 52px;
          padding: 17px 18px;
          font-size: 17px;
        }

        .monitor-hint {
          font-size: 13px;
        }

        .notify-row {
          flex-direction: column;
          align-items: stretch;
        }

        .notify-row button {
          width: 100%;
          min-height: 48px;
        }

        .profile {
          flex-direction: column;
          text-align: center;
          align-items: center;
          margin-bottom: 28px;
        }

        .profile > div:last-child {
          width: 100%;
          text-align: center;
        }

        .stats {
          flex-direction: column;
        }

        .card {
          flex: 1 1 auto;
          width: 100%;
        }

        .log {
          font-size: 11px;
          padding: 11px;
        }

        .boot-screen {
          padding: calc(18px + env(safe-area-inset-top))
            calc(12px + env(safe-area-inset-right))
            calc(22px + env(safe-area-inset-bottom))
            calc(12px + env(safe-area-inset-left));
        }

        .boot-log {
          font-size: 12px;
        }

        .boot-ascii {
          font-size: clamp(6px, 1.9vw, 9px);
        }
      }
    </style>
  </head>

  <body>
    <div id="bootScreen" class="boot-screen">
      <div class="boot-brand">roblox-monitor</div>

      <div id="bootLog" class="boot-log"></div>
    </div>

    <div id="appMain" class="app-main hidden">
      <div class="title">Roblox Presence Monitor</div>

      <details class="credentials-drawer">
        <summary class="credentials-drawer-summary">
          <span class="credentials-drawer-title">
            トークン・監視ユーザー名の入力
          </span>
          <span class="credentials-drawer-sub">
            タップして開く（閉じておくとのぞき見対策になります）
          </span>
        </summary>

        <div class="credentials-drawer-body">
          <div class="settings">
            <div class="settings-title">設定</div>

            <div class="settings-hint">
              DevTools → Application → Cookies の
              <code>.ROBLOSECURITY</code> の値だけを貼る（このブラウザの
              localStorage に保存）。
            </div>

            <div class="settings-row">
              <input
                id="tokenInput"
                class="token-input"
                type="password"
                placeholder=".ROBLOSECURITY を貼り付け"
                autocomplete="current-password"
                autocorrect="off"
                autocapitalize="none"
                spellcheck="false"
              />

              <button type="button" onclick="saveToken()">保存</button>

              <button type="button" class="secondary" onclick="clearToken()">
                クリア
              </button>
            </div>

            <div id="tokenStatus" class="token-status">Token: 未設定</div>
          </div>

          <div class="search">
            <div class="search-row">
              <input
                id="usernameInput"
                placeholder="ユーザー名（@不要）例: Player123"
                autocomplete="username"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                enterkeyhint="search"
              />

              <button type="button" onclick="startMonitor()">Monitor</button>

              <button
                type="button"
                class="secondary"
                onclick="refreshStatusNow()"
              >
                再読み込み
              </button>
            </div>
          </div>
        </div>
      </details>

      <div id="monitorHint" class="monitor-hint" aria-live="polite"></div>

      <div class="notify-row">
        <button
          type="button"
          class="secondary"
          onclick="requestInGameNotifications()"
        >
          IN GAME のときブラウザ通知（許可）
        </button>
        <span id="notifyStatus" class="notify-status"></span>
      </div>

      <div class="profile">
        <img id="avatar" class="avatar" />

        <div>
          <div id="displayName" class="display-name"></div>

          <div id="username" class="username"></div>

          <div id="status" class="status">—</div>

          <div id="game" class="game">
            ユーザー名を入力して Monitor を押すと /status で取得します。
          </div>
        </div>
      </div>

      <div class="stats">
        <div class="card">
          <div class="card-title">USER ID</div>

          <div id="userId" class="card-value">—</div>
        </div>

        <div class="card">
          <div class="card-title">FRIENDS</div>

          <div id="friends" class="card-value">—</div>
        </div>

        <div class="card">
          <div class="card-title">FOLLOWERS</div>

          <div id="followers" class="card-value">—</div>
        </div>
      </div>

      <div class="logs-title">Session Logs</div>

      <div id="logs"></div>
    </div>

    <script>
      const API_BASE = "https://roblox-monitor-owse.onrender.com";
      const TOKEN_KEY = "robloxRoblosecurity";
      const WATCH_USERNAME_KEY = "robloxWatchUsername";
      const MIN_BOOT_MS = 6000;
      // Poller hits /status which aggregates Roblox calls — shorter interval raises 429 risk.
      const POLL_INTERVAL_MS = 20000;

      const ROBLOX_ASCII = [
        "┌──────────────────────────────────────┐",
        "│       █   █  ███  █   █  ███         │",
        "│       █   █ █   █ █   █ █   █        │",
        "│       █ █ █ █████ █████ █   █        │",
        "│       █████ █   █ █   █ █   █        │",
        "│       █   █ █   █ █   █  ███         │",
        "│                                      │",
        "│           WELCOME TO WAHOROX         │",
        "└──────────────────────────────────────┘",
      ].join("\n");

      const BOOT_SEQUENCE = [
        { wait: 300, text: "INCOMING HTTP REQUEST DETECTED ..." },
        { wait: 900, text: "SERVICE WAKING UP ..." },
        { wait: 700, ascii: true },
        { wait: 800, text: "ALLOCATING COMPUTE RESOURCES ..." },
        { wait: 700, text: "PREPARING INSTANCE FOR INITIALIZATION ..." },
        { wait: 700, text: "STARTING THE INSTANCE ..." },
        { wait: 600, text: "ENVIRONMENT VARIABLES INJECTED ..." },
        { wait: 600, text: "FINALIZING STARTUP ..." },
        { wait: 600, text: "OPTIMIZING DEPLOYMENT ..." },
        {
          wait: 500,
          text: "STEADY HANDS. CLEAN LOGS. YOUR APP IS ALMOST LIVE ...",
        },
      ];

      let pollTimer = null;
      const logs = [];

      let lastNotifySnapshot = { status: "", gameLine: "" };

      function setMonitorHint(text) {
        const el = document.getElementById("monitorHint");
        if (el) {
          el.innerText = text || "";
        }
      }

      function fmtStat(v) {
        if (v == null || v === "") {
          return "—";
        }

        return String(v);
      }

      function syncNotifyStatusLabel() {
        const el = document.getElementById("notifyStatus");

        if (!el || !("Notification" in window)) {
          return;
        }

        if (Notification.permission === "granted") {
          el.innerText =
            "通知: 許可済み（IN GAME に入ったとき / ゲーム切替で通知）";
        } else if (Notification.permission === "denied") {
          el.innerText =
            "通知: ブラウザからブロックされています。設定から許可してください。";
        } else {
          el.innerText =
            "未許可 — ボタンで許可すると通知できます（HTTPS ページのみ）。";
        }
      }

      async function requestInGameNotifications() {
        const el = document.getElementById("notifyStatus");

        if (!("Notification" in window)) {
          if (el) {
            el.innerText = "このブラウザは通知 API に対応していません。";
          }

          return;
        }

        try {
          const p = await Notification.requestPermission();

          if (el) {
            if (p === "granted") {
              el.innerText =
                "通知: オン — 監視ユーザーが IN GAME になったときに通知します。";

              try {
                new Notification("roblox-monitor", {
                  body: "通知のテストです。IN GAME でまたお知らせします。",
                });
              } catch (_) {}
            } else if (p === "denied") {
              el.innerText =
                "通知が拒否されました。ブラウザのサイト設定から許可してください。";
            } else {
              el.innerText = "許可ダイアログがキャンセルされました。";
            }
          }
        } catch (err) {
          console.error(err);

          if (el) {
            el.innerText = "通知の許可リクエストに失敗しました。";
          }
        }

        syncNotifyStatusLabel();
      }

      function pickNotifyGameLine(data) {
        if ((data.status || "") !== "IN GAME") {
          return "";
        }

        const g = (data.game || "").trim();

        if (g) {
          return g;
        }

        const u = (data.universeName || "").trim();

        if (u) {
          return u;
        }

        return "ゲームに入室（タイトル未取得）";
      }

      function notifyIfEnteredInGame(data) {
        const status = data.status || "";
        const gameLine = pickNotifyGameLine(data);

        try {
          if (!("Notification" in window)) {
            return;
          }

          if (Notification.permission === "granted" && status === "IN GAME") {
            const prev = lastNotifySnapshot;

            const entered = prev.status !== "IN GAME";

            const switched =
              prev.status === "IN GAME" &&
              gameLine &&
              prev.gameLine &&
              gameLine !== prev.gameLine;

            if (entered || switched) {
              try {
                const name =
                  data.displayName ||
                  data.username ||
                  getWatchUsername() ||
                  "ユーザー";

                new Notification(name + " が IN GAME", {
                  body: gameLine,
                  tag: "roblox-monitor-ingame",
                  renotify: switched,
                });
              } catch (_) {}
            }
          }
        } finally {
          lastNotifySnapshot = { status: status, gameLine: gameLine };
        }
      }

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function bootTime() {
        const d = new Date();
        return [d.getHours(), d.getMinutes(), d.getSeconds()]
          .map((n) => String(n).padStart(2, "0"))
          .join(":");
      }

      function appendBootLine(text) {
        const bootLog = document.getElementById("bootLog");
        const line = document.createElement("div");
        line.className = "boot-line";
        line.textContent = bootTime() + "  " + text;
        bootLog.appendChild(line);
        bootLog.scrollTop = bootLog.scrollHeight;
      }

      function appendBootAscii() {
        const bootLog = document.getElementById("bootLog");
        const block = document.createElement("pre");
        block.className = "boot-ascii";
        block.textContent = ROBLOX_ASCII;
        bootLog.appendChild(block);
        bootLog.scrollTop = bootLog.scrollHeight;
      }

      async function pingHealth() {
        const res = await fetch(API_BASE + "/health?t=" + Date.now(), {
          headers: apiHeaders(),
        });
        return res.ok;
      }

      async function waitForHealthDeadline(maxMs) {
        const end = Date.now() + maxMs;

        while (Date.now() < end) {
          try {
            if (await pingHealth()) {
              return true;
            }
          } catch (_) {
            /* ignore */
          }
          await sleep(2000);
        }

        return false;
      }

      async function playBootAnimation() {
        for (const step of BOOT_SEQUENCE) {
          await sleep(step.wait);
          if (step.ascii) {
            appendBootAscii();
          } else {
            appendBootLine(step.text);
          }
        }

        const ok = await waitForHealthDeadline(75000);

        if (!ok) {
          appendBootLine(
            "TIMEOUT — API (" + API_BASE + ") が応答しませんでした。",
          );
          appendBootLine(
            "Render の無料枠はスリープしていることがあります。しばらく待ってリロードしてください。",
          );
          await sleep(2500);
        } else {
          appendBootLine("API ONLINE ...");
          await sleep(500);
        }
      }

      async function showMainApp() {
        const bootScreen = document.getElementById("bootScreen");
        const appMain = document.getElementById("appMain");

        bootScreen.classList.add("fade-out");
        appMain.classList.remove("hidden");

        setTimeout(() => {
          bootScreen.classList.add("hidden");
        }, 500);

        await updateTokenStatus();
        const savedName = localStorage.getItem(WATCH_USERNAME_KEY);
        if (savedName) {
          document.getElementById("usernameInput").value = savedName;
        }
        pollTimer = setInterval(loadStatus, POLL_INTERVAL_MS);
        if (getWatchUsername()) {
          loadStatus();
        } else {
          setMonitorHint(
            "監視するユーザー名を入れて Monitor を押してください。",
          );
        }

        syncNotifyStatusLabel();
      }

      async function runBootSequence() {
        const started = Date.now();

        await playBootAnimation();

        const elapsed = Date.now() - started;
        if (elapsed < MIN_BOOT_MS) {
          await sleep(MIN_BOOT_MS - elapsed);
        }

        showMainApp();
      }

      function normalizeToken(raw) {
        let value = raw.trim();

        if (value.toLowerCase().startsWith(".roblosecurity=")) {
          const parts = value.split("=", 2);
          if (parts.length > 1) {
            value = parts[1].trim();
          }
        }

        if (
          value.length >= 2 &&
          value[0] === value[value.length - 1] &&
          (value[0] === '"' || value[0] === "'")
        ) {
          value = value.slice(1, -1).trim();
        }

        return value;
      }

      function getToken() {
        return normalizeToken(localStorage.getItem(TOKEN_KEY) || "");
      }

      function normalizeWatchUsername(raw) {
        let s = (raw || "").trim();
        if (s.startsWith("@")) {
          s = s.slice(1).trim();
        }
        return s;
      }

      function getWatchUsername() {
        const typed = normalizeWatchUsername(
          document.getElementById("usernameInput").value,
        );
        if (typed) {
          return typed;
        }
        return normalizeWatchUsername(
          localStorage.getItem(WATCH_USERNAME_KEY) || "",
        );
      }

      async function updateTokenStatus() {
        const el = document.getElementById("tokenStatus");
        const token = getToken();

        if (!token) {
          el.innerText = "Token: 未設定";
          el.className = "token-status";
          return;
        }

        el.innerText = "Token: 確認中…";
        el.className = "token-status";

        try {
          const res = await fetch(API_BASE + "/auth/verify", {
            headers: { "X-Roblox-Security": token },
          });
          const data = await res.json();

          if (data.state === "valid") {
            el.innerText = "Token: OK（あなたの userId " + data.userId + "）";
            el.className = "token-status ok";
          } else if (data.state === "invalid") {
            el.innerText = "Token: 無効 — Roblox で貼り直し";
            el.className = "token-status warn";
          } else if (data.state === "unknown") {
            el.innerText = "Token: 保存済み（検証できず送信は試します）";
            el.className = "token-status ok";
          } else if (data.valid) {
            el.innerText = "Token: 保存済み";
            el.className = "token-status ok";
          } else {
            el.innerText = "Token: 無効";
            el.className = "token-status warn";
          }
        } catch {
          el.innerText = "Token: 保存済み（オフラインのため未検証）";
          el.className = "token-status ok";
        }
      }

      async function saveToken() {
        const value = normalizeToken(
          document.getElementById("tokenInput").value,
        );

        if (!value) {
          alert(".ROBLOSECURITY の値を貼ってください。");
          return;
        }

        localStorage.setItem(TOKEN_KEY, value);
        document.getElementById("tokenInput").value = "";
        await updateTokenStatus();
        if (pollTimer) {
          loadStatus();
        }
      }

      function clearToken() {
        localStorage.removeItem(TOKEN_KEY);
        document.getElementById("tokenInput").value = "";
        updateTokenStatus();
        if (pollTimer) {
          loadStatus();
        }
      }

      function apiHeaders() {
        const headers = {};
        const token = getToken();

        if (token) {
          headers["X-Roblox-Security"] = token;
        }

        return headers;
      }

      /** 古い fetch が遅れて DOM を上書きしないよう、直近の読み込みだけ反映する */
      let statusFetchGeneration = 0;

      let statusAbortController = null;

      function showPendingProfile(forUsername) {
        const avatarEl = document.getElementById("avatar");
        avatarEl.removeAttribute("src");

        document.getElementById("displayName").innerText = forUsername;
        document.getElementById("username").innerText = "@" + forUsername;

        document.getElementById("status").innerText = "取得中…";
        document.getElementById("game").innerText =
          "API（/status）へ問い合わせています…";

        document.getElementById("userId").innerText = "—";
        document.getElementById("friends").innerText = "—";
        document.getElementById("followers").innerText = "—";

        setMonitorHint(
          "「@" + forUsername + "」について Render 上の API に取得中です。",
        );
      }

      async function loadStatus() {
        const uname = getWatchUsername();

        if (!uname) {
          return;
        }

        if (statusAbortController) {
          try {
            statusAbortController.abort();
          } catch (_) {}
        }

        statusAbortController = new AbortController();
        const signal = statusAbortController.signal;

        const gen = ++statusFetchGeneration;

        setMonitorHint(
          "/status を取得しています…（クエリ username=@" + uname + "）",
        );

        try {
          const url =
            API_BASE +
            "/status?username=" +
            encodeURIComponent(uname) +
            "&t=" +
            Date.now();

          const res = await fetch(url, {
            headers: apiHeaders(),
            signal,
          });

          // レート制限: 画面は現状維持（取得中のまま／直近の表示を維持）
          if (res.status === 429) {
            return;
          }

          const data = await res.json();

          if (gen !== statusFetchGeneration) {
            return;
          }

          if (data.error) {
            document.getElementById("status").innerText = "ERROR";
            document.getElementById("game").innerText = data.error;
            setMonitorHint(
              "API がエラーを返しました（上の ERROR / 説明を確認）。",
            );
            return;
          }

          const avatarEl = document.getElementById("avatar");

          if (data.avatar) {
            avatarEl.src = data.avatar;
          } else {
            avatarEl.removeAttribute("src");
          }

          document.getElementById("displayName").innerText =
            data.displayName || "";

          document.getElementById("username").innerText =
            "@" + (data.username || "");

          document.getElementById("status").innerText =
            data.status || "UNKNOWN";

          document.getElementById("game").innerText =
            data.presenceNote || data.presenceError || data.game || "";

          document.getElementById("userId").innerText = fmtStat(data.userId);
          document.getElementById("friends").innerText = fmtStat(data.friends);
          document.getElementById("followers").innerText = fmtStat(
            data.followers,
          );

          setMonitorHint(
            "取得できました（サーバー時刻 " +
              (data.updated || "—") +
              "）。下のプレゼンスは Roblox API の応答に基づきます。",
          );

          const latestLog =
            "[" +
            data.updated +
            "] " +
            data.status +
            " " +
            (data.presenceNote || data.presenceError || data.game || "");

          if (logs.length === 0 || logs[logs.length - 1] !== latestLog) {
            logs.push(latestLog);
          }

          const logsDiv = document.getElementById("logs");
          logsDiv.innerHTML = "";

          logs
            .slice()
            .reverse()
            .forEach((log) => {
              const el = document.createElement("div");
              el.className = "log";
              el.innerText = log;
              logsDiv.appendChild(el);
            });

          try {
            notifyIfEnteredInGame(data);
          } catch (_) {}
        } catch (err) {
          console.error(err);

          if (err && err.name === "AbortError") {
            return;
          }

          if (gen !== statusFetchGeneration) {
            return;
          }

          document.getElementById("status").innerText = "NETWORK";
          document.getElementById("game").innerText = "API に接続できません。";
          setMonitorHint(
            "fetch に失敗しました。Network タブか API の稼働を確認してください。",
          );
        }
      }

      function startMonitor() {
        const uname = normalizeWatchUsername(
          document.getElementById("usernameInput").value,
        );

        if (!uname) {
          alert(
            "@の後ろのユーザー名を入力してください（@は付けなくても大丈夫です）。",
          );
          return;
        }

        localStorage.setItem(WATCH_USERNAME_KEY, uname);
        document.getElementById("usernameInput").value = uname;

        logs.length = 0;
        document.getElementById("logs").innerHTML = "";

        lastNotifySnapshot = { status: "", gameLine: "" };

        showPendingProfile(uname);
        loadStatus();
      }

      function refreshStatusNow() {
        if (!getWatchUsername()) {
          alert("ユーザー名を入力するか、Monitor で一度保存してください。");
          return;
        }

        loadStatus();
      }

      runBootSequence();
    </script>
  </body>
</html>
