<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Roblox Presence Monitor</title>

    <style>
      body {
        background: #0f0f0f;
        color: white;
        font-family: sans-serif;
        padding: 40px;
        max-width: 900px;
        margin: auto;
      }

      .title {
        font-size: 48px;
        margin-bottom: 40px;
        font-weight: bold;
      }

      .search,
      .settings {
        margin-bottom: 40px;
      }

      .settings {
        background: #1a1a1a;
        padding: 24px;
        border-radius: 16px;
      }

      .settings-title {
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .settings-hint {
        color: #888;
        font-size: 14px;
        margin-bottom: 16px;
        line-height: 1.5;
      }

      .settings-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .settings-row button {
        margin-left: 0;
      }

      .token-input {
        flex: 1;
        min-width: 280px;
      }

      .token-status {
        margin-top: 12px;
        font-size: 14px;
        color: #888;
      }

      .token-status.ok {
        color: #4ade80;
      }

      .token-status.warn {
        color: #fbbf24;
      }

      input {
        padding: 14px;
        width: 300px;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        background: #1f1f1f;
        color: white;
      }

      button {
        padding: 14px 20px;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        background: #2563eb;
        color: white;
        cursor: pointer;
        margin-left: 10px;
      }

      button.secondary {
        background: #333;
      }

      .profile {
        display: flex;
        gap: 30px;
        align-items: center;
        margin-bottom: 40px;
      }

      .avatar {
        width: 140px;
        height: 140px;
        border-radius: 20px;
        object-fit: cover;
        background: #1f1f1f;
      }

      .display-name {
        font-size: 40px;
        font-weight: bold;
      }

      .username {
        color: #888;
        font-size: 22px;
        margin-top: 5px;
      }

      .status {
        font-size: 60px;
        font-weight: bold;
        margin-top: 20px;
      }

      .game {
        font-size: 28px;
        margin-top: 10px;
        color: #ccc;
      }

      .stats {
        display: flex;
        gap: 20px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      .card {
        background: #1a1a1a;
        padding: 20px;
        border-radius: 16px;
        min-width: 160px;
      }

      .card-title {
        color: #888;
        margin-bottom: 10px;
      }

      .card-value {
        font-size: 28px;
        font-weight: bold;
      }

      .logs-title {
        margin-top: 50px;
        margin-bottom: 20px;
        font-size: 32px;
      }

      .log {
        background: #1a1a1a;
        padding: 14px;
        border-radius: 12px;
        margin-bottom: 10px;
        font-family: monospace;
      }

      .hidden {
        display: none !important;
      }

      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #0d0d0d;
        padding: 48px;
        overflow: auto;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        transition: opacity 0.45s ease;
      }

      .boot-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .boot-brand {
        font-family: sans-serif;
        font-size: 15px;
        font-weight: 600;
        color: #f5f5f5;
        margin-bottom: 36px;
        letter-spacing: 0.02em;
      }

      .boot-log {
        font-size: 13px;
        line-height: 1.75;
        color: #d4d4d4;
      }

      .boot-line {
        white-space: pre-wrap;
      }

      .boot-ascii {
        margin: 12px 0 20px;
        color: #f0f0f0;
        white-space: pre;
        font-size: 11px;
        line-height: 1.15;
      }
    </style>
  </head>

  <body>
    <div id="bootScreen" class="boot-screen">
      <div class="boot-brand">roblox-monitor</div>

      <div id="bootLog" class="boot-log"></div>
    </div>

    <div id="appMain" class="app-main hidden">
    <div class="title">Roblox Presence Monitor</div>

    <div class="settings">
      <div class="settings-title">設定</div>

      <div class="settings-hint">
        DevTools → Application → Cookies の
        <code>.ROBLOSECURITY</code> の値だけを貼る（このブラウザの localStorage に保存）。
      </div>

      <div class="settings-row">
        <input
          id="tokenInput"
          class="token-input"
          type="password"
          placeholder=".ROBLOSECURITY"
          autocomplete="off"
        />

        <button type="button" onclick="saveToken()">保存</button>

        <button type="button" class="secondary" onclick="clearToken()">
          クリア
        </button>
      </div>

      <div id="tokenStatus" class="token-status">Token: 未設定</div>

      <div class="settings-hint" style="margin-top: 1rem">
        監視対象はプロフィール URL の<strong>数字の User ID</strong>で指定することを推奨します。
      </div>

      <div class="settings-row">
        <input
          id="targetUserIdInput"
          class="token-input"
          type="text"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="例: 10743903486"
          autocomplete="off"
        />

        <button type="button" onclick="saveTargetUserId()">User ID を保存</button>

        <button type="button" class="secondary" onclick="clearTargetUserId()">
          クリア
        </button>
      </div>

      <div id="targetIdStatus" class="token-status">User ID: 未設定</div>
    </div>

    <div class="search">
      <input
        id="usernameInput"
        placeholder="ユーザー名は User ID がないときのみ（例: nagi_LoveIsToSuffer）"
      />

      <button onclick="startMonitor()">Monitor</button>
    </div>

    <div class="profile">
      <img id="avatar" class="avatar" />

      <div>
        <div id="displayName" class="display-name"></div>

        <div id="username" class="username"></div>

        <div id="status" class="status">OFFLINE</div>

        <div id="game" class="game"></div>
      </div>
    </div>

    <div class="stats">
      <div class="card">
        <div class="card-title">USER ID</div>

        <div id="userId" class="card-value"></div>
      </div>

      <div class="card">
        <div class="card-title">FRIENDS</div>

        <div id="friends" class="card-value"></div>
      </div>

      <div class="card">
        <div class="card-title">FOLLOWERS</div>

        <div id="followers" class="card-value"></div>
      </div>
    </div>

    <div class="logs-title">Session Logs</div>

    <div id="logs"></div>

    </div>

    <script>
      const API_BASE = "https://roblox-monitor-owse.onrender.com";
      const TOKEN_KEY = "robloxRoblosecurity";
      const TARGET_USER_ID_KEY = "robloxTargetUserId";
      const MIN_BOOT_MS = 6000;

      const ROBLOX_ASCII = [
        "┌──────────────────────────────────────┐",
        "│  ██╗    ██╗███████╗██╗      ██████╗ │",
        "│  ██║    ██║██╔════╝██║     ██╔═══██╗│",
        "│  ██║ █╗ ██║█████╗  ██║     ██║   ██║│",
        "│  ██║███╗██║██╔══╝  ██║     ██║   ██║│",
        "│  ╚███╔███╔╝███████╗███████╗╚██████╔╝│",
        "│   ╚══╝╚══╝ ╚══════╝╚══════╝ ╚═════╝ │",
        "│         WELCOME TO ROBLOX            │",
        "└──────────────────────────────────────┘",
      ].join("\n");

      const BOOT_SEQUENCE = [
        { wait: 300, text: "INCOMING HTTP REQUEST DETECTED ..." },
        { wait: 900, text: "SERVICE WAKING UP ..." },
        { wait: 700, ascii: true },
        { wait: 800, text: "ALLOCATING COMPUTE RESOURCES ..." },
        { wait: 700, text: "PREPARING INSTANCE FOR INITIALIZATION ..." },
        { wait: 700, text: "STARTING THE INSTANCE ..." },
        { wait: 600, text: "ENVIRONMENT VARIABLES INJECTED ..." },
        { wait: 600, text: "FINALIZING STARTUP ..." },
        { wait: 600, text: "OPTIMIZING DEPLOYMENT ..." },
        { wait: 500, text: "STEADY HANDS. CLEAN LOGS. YOUR APP IS ALMOST LIVE ..." },
      ];

      let pollTimer = null;
      const logs = [];

      function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }

      function bootTime() {
        const d = new Date();
        return [d.getHours(), d.getMinutes(), d.getSeconds()]
          .map((n) => String(n).padStart(2, "0"))
          .join(":");
      }

      function appendBootLine(text) {
        const bootLog = document.getElementById("bootLog");
        const line = document.createElement("div");
        line.className = "boot-line";
        line.textContent = bootTime() + "  " + text;
        bootLog.appendChild(line);
        bootLog.scrollTop = bootLog.scrollHeight;
      }

      function appendBootAscii() {
        const bootLog = document.getElementById("bootLog");
        const block = document.createElement("pre");
        block.className = "boot-ascii";
        block.textContent = ROBLOX_ASCII;
        bootLog.appendChild(block);
        bootLog.scrollTop = bootLog.scrollHeight;
      }

      async function pingHealth() {
        const res = await fetch(API_BASE + "/health?t=" + Date.now(), {
          headers: apiHeaders(),
        });
        return res.ok;
      }

      async function waitForHealthDeadline(maxMs) {
        const end = Date.now() + maxMs;

        while (Date.now() < end) {
          try {
            if (await pingHealth()) {
              return true;
            }
          } catch (_) {
            /* ignore */
          }
          await sleep(2000);
        }

        return false;
      }

      async function playBootAnimation() {
        for (const step of BOOT_SEQUENCE) {
          await sleep(step.wait);
          if (step.ascii) {
            appendBootAscii();
          } else {
            appendBootLine(step.text);
          }
        }

        const ok = await waitForHealthDeadline(75000);

        if (!ok) {
          appendBootLine(
            "TIMEOUT — API (" + API_BASE + ") が応答しませんでした。",
          );
          appendBootLine("Render の無料枠はスリープしていることがあります。しばらく待ってリロードしてください。");
          await sleep(2500);
        } else {
          appendBootLine("API ONLINE ...");
          await sleep(500);
        }
      }

      async function showMainApp() {
        const bootScreen = document.getElementById("bootScreen");
        const appMain = document.getElementById("appMain");

        bootScreen.classList.add("fade-out");
        appMain.classList.remove("hidden");

        setTimeout(() => {
          bootScreen.classList.add("hidden");
        }, 500);

        await updateTokenStatus();
        updateTargetIdStatus();
        pollTimer = setInterval(loadStatus, 5000);
      }

      async function runBootSequence() {
        const started = Date.now();

        await playBootAnimation();

        const elapsed = Date.now() - started;
        if (elapsed < MIN_BOOT_MS) {
          await sleep(MIN_BOOT_MS - elapsed);
        }

        showMainApp();
      }

      function normalizeToken(raw) {
        let value = raw.trim();

        if (value.toLowerCase().startsWith(".roblosecurity=")) {
          const parts = value.split("=", 2);
          if (parts.length > 1) {
            value = parts[1].trim();
          }
        }

        if (
          value.length >= 2 &&
          value[0] === value[value.length - 1] &&
          (value[0] === '"' || value[0] === "'")
        ) {
          value = value.slice(1, -1).trim();
        }

        return value;
      }

      function getToken() {
        return normalizeToken(localStorage.getItem(TOKEN_KEY) || "");
      }

      function getTargetUserId() {
        return (localStorage.getItem(TARGET_USER_ID_KEY) || "").trim();
      }

      function updateTargetIdStatus() {
        const st = document.getElementById("targetIdStatus");
        if (!st) {
          return;
        }
        const id = getTargetUserId();
        if (!id) {
          st.innerText = "User ID: 未設定";
          return;
        }
        st.innerText = "User ID: " + id + " （保存済み）";
      }

      function saveTargetUserId() {
        const raw = document.getElementById("targetUserIdInput").value.trim();
        if (!raw || !/^\d+$/.test(raw)) {
          alert("数字の User ID だけ入力してください（プロフィールURLの数字）。");
          return;
        }
        localStorage.setItem(TARGET_USER_ID_KEY, raw);
        document.getElementById("targetUserIdInput").value = "";
        updateTargetIdStatus();
        if (pollTimer) {
          loadStatus();
        }
      }

      function clearTargetUserId() {
        localStorage.removeItem(TARGET_USER_ID_KEY);
        document.getElementById("targetUserIdInput").value = "";
        updateTargetIdStatus();
        if (pollTimer) {
          loadStatus();
        }
      }

      async function updateTokenStatus() {
        const el = document.getElementById("tokenStatus");
        const token = getToken();

        if (!token) {
          el.innerText = "Token: 未設定";
          el.className = "token-status";
          return;
        }

        el.innerText = "Token: 確認中…";
        el.className = "token-status";

        try {
          const res = await fetch(API_BASE + "/auth/verify", {
            headers: { "X-Roblox-Security": token },
          });
          const data = await res.json();

          if (data.state === "valid") {
            el.innerText =
              "Token: OK（あなたの userId " + data.userId + "）";
            el.className = "token-status ok";
          } else if (data.state === "invalid") {
            el.innerText =
              "Token: 無効 — Roblox で貼り直し";
            el.className = "token-status warn";
          } else if (data.state === "unknown") {
            el.innerText =
              "Token: 保存済み（検証できず送信は試します）";
            el.className = "token-status ok";
          } else if (data.valid) {
            el.innerText = "Token: 保存済み";
            el.className = "token-status ok";
          } else {
            el.innerText = "Token: 無効";
            el.className = "token-status warn";
          }
        } catch {
          el.innerText = "Token: 保存済み（オフラインのため未検証）";
          el.className = "token-status ok";
        }
      }

      async function saveToken() {
        const value = normalizeToken(
          document.getElementById("tokenInput").value,
        );

        if (!value) {
          alert(".ROBLOSECURITY の値を貼ってください。");
          return;
        }

        localStorage.setItem(TOKEN_KEY, value);
        document.getElementById("tokenInput").value = "";
        await updateTokenStatus();
        if (pollTimer) {
          loadStatus();
        }
      }

      function clearToken() {
        localStorage.removeItem(TOKEN_KEY);
        document.getElementById("tokenInput").value = "";
        updateTokenStatus();
        if (pollTimer) {
          loadStatus();
        }
      }

      function apiHeaders() {
        const headers = {};
        const token = getToken();

        if (token) {
          headers["X-Roblox-Security"] = token;
        }

        return headers;
      }

      async function loadStatus() {
        const uid = getTargetUserId();
        const uname = document.getElementById("usernameInput").value.trim();

        if (!uid && !uname) {
          return;
        }

        try {
          let url =
            API_BASE +
            "/status?t=" +
            Date.now();

          if (uid) {
            url += "&userId=" + encodeURIComponent(uid);
          } else {
            url += "&username=" + encodeURIComponent(uname);
          }

          const res = await fetch(url, {
            headers: apiHeaders(),
          });

          const data = await res.json();

          if (data.error) {
            document.getElementById("status").innerText = "ERROR";
            document.getElementById("game").innerText = data.error;
            return;
          }

          const avatarEl = document.getElementById("avatar");

          if (data.avatar) {
            avatarEl.src = data.avatar;
          } else {
            avatarEl.removeAttribute("src");
          }

          document.getElementById("displayName").innerText =
            data.displayName || "";

          document.getElementById("username").innerText =
            "@" + (data.username || "");

          document.getElementById("status").innerText =
            data.status || "UNKNOWN";

          document.getElementById("game").innerText =
            data.presenceNote || data.presenceError || data.game || "";

          document.getElementById("userId").innerText = data.userId;
          document.getElementById("friends").innerText = data.friends;
          document.getElementById("followers").innerText = data.followers;

          const latestLog =
            "[" +
            data.updated +
            "] " +
            data.status +
            " " +
            (data.presenceNote || data.presenceError || data.game || "");

          if (logs.length === 0 || logs[logs.length - 1] !== latestLog) {
            logs.push(latestLog);
          }

          const logsDiv = document.getElementById("logs");
          logsDiv.innerHTML = "";

          logs
            .slice()
            .reverse()
            .forEach((log) => {
              const el = document.createElement("div");
              el.className = "log";
              el.innerText = log;
              logsDiv.appendChild(el);
            });
        } catch (err) {
          console.error(err);

          document.getElementById("status").innerText = "NETWORK";
          document.getElementById("game").innerText =
            "API に接続できません。";
        }
      }

      function startMonitor() {
        const uid = getTargetUserId();
        const uname = document
          .getElementById("usernameInput")
          .value.trim();

        if (!uid && !uname) {
          alert("「User ID を保存」するか、下のユーザー名を入力してください。");
          return;
        }

        logs.length = 0;
        loadStatus();
      }

      updateTargetIdStatus();
      runBootSequence();
    </script>
  </body>
</html>
